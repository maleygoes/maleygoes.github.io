<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Weekly Schedule</title>
  <script src="schedule-data.js"></script>
  <style>
    :root {
      --paper: #fffefb;
      --ink: #171717;
      --muted: #5d6267;
      --rule: #2e3133;
      --soft-rule: #c8cccf;
      --panel: #f3f3f1;
      --accent: #155e75;
      --focus: #7c3aed;
      --office-bg: #dff3df;
      --office-border: #2f6f3e;
      --course-bg: #fff0ad;
      --course-border: #8b6800;
      --online-bg: #d9eff8;
      --online-border: #176780;
      --meeting-bg: #252525;
      --meeting-border: #000;
      --meeting-ink: #fff;
      --mindfulness-bg: #fff7c7;
      --mindfulness-border: #876b00;
      --other-bg: #ece8f6;
      --other-border: #5b4b86;
      --shadow: 0 12px 35px rgb(0 0 0 / 8%);
      --pixels-per-minute: 1.15px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #e8e8e5;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.45;
    }

    a {
      color: #064f92;
      text-underline-offset: 0.15em;
    }

    a:hover {
      text-decoration-thickness: 0.13em;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      left: 1rem;
      top: -8rem;
      z-index: 100;
      padding: 0.7rem 1rem;
      background: #fff;
      border: 2px solid #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .skip-link:focus {
      top: 1rem;
    }

    .page {
      width: min(1180px, calc(100% - 2rem));
      margin: 2rem auto;
      padding: clamp(1rem, 3vw, 3.25rem);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .masthead {
      max-width: 760px;
      margin: 0 auto 2rem;
      padding: 1.1rem 1.5rem 1.2rem;
      border: 2px solid var(--rule);
      border-radius: 0.35rem;
      text-align: center;
      background: var(--panel);
    }

    .masthead p {
      margin: 0;
      font-size: clamp(1.25rem, 2.8vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.015em;
    }

    .masthead h1 {
      margin: 0.45rem 0 0;
      font-size: clamp(1.5rem, 3.4vw, 2.15rem);
      line-height: 1.2;
    }

    .term {
      display: block;
      margin-top: 0.35rem;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .current-panel {
      margin: 0 0 2rem;
      padding: 1rem 1.2rem;
      border-left: 0.42rem solid var(--accent);
      background: #edf5f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .current-panel h2 {
      margin: 0 0 0.3rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
    }

    .current-panel p {
      margin: 0.18rem 0;
    }

    .current-panel .stamp {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .visual-heading,
    .details-heading {
      margin: 0 0 0.9rem;
      font-size: 1.35rem;
    }

    .visual-note {
      margin: -0.55rem 0 1rem;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.92rem;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 5.4rem repeat(5, minmax(0, 1fr));
      grid-template-rows: auto var(--track-height);
      margin-bottom: 2.2rem;
      border-bottom: 1px solid var(--rule);
      min-width: 850px;
    }

    .schedule-scroll {
      overflow-x: auto;
      padding-bottom: 0.35rem;
    }

    .corner,
    .day-header {
      padding: 0.55rem 0.35rem;
      border-bottom: 1.5px solid var(--rule);
      text-align: center;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .time-axis {
      position: relative;
      height: var(--track-height);
      border-right: 1px solid var(--rule);
    }

    .time-label {
      position: absolute;
      right: 0.55rem;
      transform: translateY(-50%);
      white-space: nowrap;
      color: #35383a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.73rem;
    }

    .time-label.hour {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .day-track {
      position: relative;
      height: var(--track-height);
      border-right: 1px solid var(--rule);
      background-image:
        linear-gradient(
          to bottom,
          transparent calc(100% - 1px),
          var(--soft-rule) 1px
        );
      background-size: 100% var(--grid-step-height);
    }

    .day-track:last-child {
      border-right: 1px solid var(--rule);
    }

    .event {
      position: absolute;
      left: 0.24rem;
      right: 0.24rem;
      overflow: hidden;
      padding: 0.35rem 0.42rem;
      border: 1.5px solid;
      border-radius: 0.18rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      line-height: 1.17;
    }

    .event strong,
    .event span {
      display: block;
    }

    .event .event-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.96rem;
      line-height: 1.08;
    }

    .event .event-time {
      margin-top: 0.15rem;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .event .event-location {
      margin-top: 0.12rem;
    }

    .event a {
      color: inherit;
      text-decoration-thickness: 1px;
    }

    .type-office {
      color: #12391d;
      background: var(--office-bg);
      border-color: var(--office-border);
    }

    .type-course {
      color: #332800;
      background: var(--course-bg);
      border-color: var(--course-border);
    }

    .type-online {
      color: #073848;
      background: var(--online-bg);
      border-color: var(--online-border);
    }

    .type-meeting {
      color: var(--meeting-ink);
      background: var(--meeting-bg);
      border-color: var(--meeting-border);
    }

    .type-mindfulness {
      color: #3b3000;
      background: var(--mindfulness-bg);
      border-color: var(--mindfulness-border);
    }

    .type-other {
      color: #2d2445;
      background: var(--other-bg);
      border-color: var(--other-border);
    }

    .event.current {
      box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--accent);
      z-index: 5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1rem;
      margin: -1rem 0 2rem 5.4rem;
      padding: 0;
      list-style: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.86rem;
    }

    .legend li {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
    }

    .swatch {
      width: 1rem;
      height: 1rem;
      border: 1.5px solid;
      border-radius: 0.12rem;
    }

    .agenda {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.8rem;
      margin-bottom: 2rem;
    }

    .day-card {
      min-width: 0;
      padding: 0.85rem;
      border: 1px solid var(--soft-rule);
      border-top: 0.25rem solid var(--rule);
      background: #fff;
    }

    .day-card h3 {
      margin: 0 0 0.65rem;
      font-size: 1.08rem;
    }

    .day-card ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .agenda-item {
      margin: 0 0 0.8rem;
      padding: 0 0 0.8rem;
      border-bottom: 1px solid #dedfdf;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
    }

    .agenda-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .agenda-item .category-label {
      display: inline-block;
      margin-bottom: 0.28rem;
      padding: 0.05rem 0.34rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .agenda-item strong,
    .agenda-item span {
      display: block;
    }

    .agenda-item time {
      font-weight: 700;
    }

    .empty-day {
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-style: italic;
    }

    .footer-note {
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 2px solid var(--rule);
      text-align: center;
    }

    .footer-note p {
      margin: 0.2rem 0;
    }

    .footer-note .primary-note {
      font-weight: 700;
    }

    .contact-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem 1rem;
      margin: 0.7rem 0 0;
      padding: 0;
      list-style: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.94rem;
    }

    .noscript {
      margin: 1rem 0;
      padding: 1rem;
      border: 2px solid #8b0000;
      background: #fff2f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    @media (max-width: 900px) {
      .page {
        width: min(100% - 1rem, 760px);
        margin: 0.5rem auto;
      }

      .visual-section,
      .legend {
        display: none;
      }

      .agenda {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 580px) {
      .page {
        padding: 1rem;
      }

      .agenda {
        grid-template-columns: 1fr;
      }

      .contact-list {
        display: block;
      }

      .contact-list li {
        margin: 0.25rem 0;
      }
    }

    @media print {
      @page {
        size: landscape;
        margin: 0.4in;
      }

      body {
        background: #fff;
      }

      .page {
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }

      .skip-link,
      .current-panel,
      .details-section {
        display: none;
      }

      .masthead {
        margin-bottom: 1rem;
      }

      .schedule-grid {
        min-width: 0;
      }

      .event {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .footer-note {
        margin-top: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#weekly-details">Skip visual calendar and go to weekly details</a>

  <main class="page">
    <header class="masthead">
      <p id="person-name"></p>
      <h1 id="page-title"></h1>
      <span class="term" id="term-label"></span>
    </header>

    <noscript>
      <p class="noscript">
        This schedule requires JavaScript to arrange the meetings. Please enable
        JavaScript, or contact the instructor using the information at the bottom
        of the page.
      </p>
    </noscript>

    <section class="current-panel" aria-labelledby="current-heading">
      <h2 id="current-heading">Where I am now</h2>
      <p id="current-summary" aria-live="polite">Checking the schedule…</p>
      <p class="stamp" id="current-stamp"></p>
    </section>

    <section class="visual-section" aria-labelledby="visual-heading">
      <h2 class="visual-heading" id="visual-heading">Week at a glance</h2>
      <p class="visual-note">
        The detailed day-by-day schedule follows this visual calendar.
      </p>
      <div class="schedule-scroll" aria-hidden="true">
        <div class="schedule-grid" id="schedule-grid"></div>
      </div>
      <ul class="legend" id="legend" aria-hidden="true"></ul>
    </section>

    <section class="details-section" id="weekly-details" aria-labelledby="details-heading">
      <h2 class="details-heading" id="details-heading">Accessible weekly details</h2>
      <div class="agenda" id="agenda"></div>
    </section>

    <footer class="footer-note">
      <p class="primary-note" id="schedule-note"></p>
      <p id="appointment-note"></p>
      <ul class="contact-list" id="contact-list" aria-label="Contact information"></ul>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const data = window.SCHEDULE_DATA;
      const DAYS = [
        { code: "M", name: "Monday", short: "Mon" },
        { code: "T", name: "Tuesday", short: "Tue" },
        { code: "W", name: "Wednesday", short: "Wed" },
        { code: "R", name: "Thursday", short: "Thu" },
        { code: "F", name: "Friday", short: "Fri" }
      ];

      const TYPES = {
        office: { label: "Office hours", className: "type-office" },
        course: { label: "In person", className: "type-course" },
        online: { label: "Online", className: "type-online" },
        meeting: { label: "Meeting", className: "type-meeting" },
        mindfulness: { label: "Mindfulness", className: "type-mindfulness" },
        other: { label: "Other", className: "type-other" }
      };

      const minuteValue = (time) => {
        const match = /^(\d{1,2}):(\d{2})$/.exec(time);
        if (!match) throw new Error(`Invalid time "${time}". Use HH:MM.`);
        return Number(match[1]) * 60 + Number(match[2]);
      };

      const formatTime = (time) => {
        const minutes = minuteValue(time);
        const hour24 = Math.floor(minutes / 60);
        const minute = minutes % 60;
        const suffix = hour24 >= 12 ? "PM" : "AM";
        const hour12 = hour24 % 12 || 12;
        return `${hour12}:${String(minute).padStart(2, "0")} ${suffix}`;
      };

      const formatRange = (event) =>
        `${formatTime(event.start)}–${formatTime(event.end)}`;

      const make = (tag, className, text) => {
        const el = document.createElement(tag);
        if (className) el.className = className;
        if (text !== undefined) el.textContent = text;
        return el;
      };

      const eventType = (event) => TYPES[event.type] || TYPES.other;

      const validate = () => {
        if (!data || !Array.isArray(data.meetings)) {
          throw new Error("schedule-data.js is missing or malformed.");
        }

        const start = minuteValue(data.dayStart);
        const end = minuteValue(data.dayEnd);
        if (start >= end) throw new Error("dayStart must be earlier than dayEnd.");

        for (const event of data.meetings) {
          if (!event.title || !event.days || !event.start || !event.end) {
            throw new Error("Each meeting needs title, days, start, and end.");
          }
          if (minuteValue(event.start) >= minuteValue(event.end)) {
            throw new Error(`"${event.title}" ends before it starts.`);
          }
          for (const code of event.days) {
            if (!DAYS.some((day) => day.code === code)) {
              throw new Error(`Unknown day code "${code}" in "${event.title}".`);
            }
          }
        }
      };

      const renderHeader = () => {
        document.title = `${data.person} — ${data.term} ${data.heading}`;
        document.getElementById("person-name").textContent = data.person;
        document.getElementById("page-title").textContent = data.heading;
        document.getElementById("term-label").textContent = data.term;
      };

      const renderVisualGrid = () => {
        const grid = document.getElementById("schedule-grid");
        const dayStart = minuteValue(data.dayStart);
        const dayEnd = minuteValue(data.dayEnd);
        const totalMinutes = dayEnd - dayStart;
        const pixelsPerMinute = 1.15;
        const height = totalMinutes * pixelsPerMinute;
        const stepHeight = data.gridMinutes * pixelsPerMinute;

        grid.style.setProperty("--track-height", `${height}px`);
        grid.style.setProperty("--grid-step-height", `${stepHeight}px`);

        grid.appendChild(make("div", "corner", ""));

        for (const day of DAYS) {
          grid.appendChild(make("div", "day-header", day.name));
        }

        const axis = make("div", "time-axis");
        for (
          let minutes = dayStart;
          minutes <= dayEnd;
          minutes += data.gridMinutes
        ) {
          const label = make(
            "span",
            `time-label ${minutes % 60 === 0 ? "hour" : ""}`,
            formatTime(
              `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(
                minutes % 60
              ).padStart(2, "0")}`
            )
          );
          label.style.top = `${(minutes - dayStart) * pixelsPerMinute}px`;
          axis.appendChild(label);
        }
        grid.appendChild(axis);

        for (const day of DAYS) {
          const track = make("div", "day-track");
          track.dataset.day = day.code;

          const events = data.meetings
            .filter((event) => event.days.includes(day.code))
            .sort((a, b) => minuteValue(a.start) - minuteValue(b.start));

          for (const event of events) {
            const top = (minuteValue(event.start) - dayStart) * pixelsPerMinute;
            const eventHeight =
              (minuteValue(event.end) - minuteValue(event.start)) *
              pixelsPerMinute;
            const type = eventType(event);
            const block = make("article", `event ${type.className}`);
            block.style.top = `${top}px`;
            block.style.height = `${eventHeight}px`;
            block.dataset.day = day.code;
            block.dataset.start = event.start;
            block.dataset.end = event.end;

            const title = make("strong", "event-title");
            if (event.url) {
              const link = make("a", "", event.title);
              link.href = event.url;
              title.appendChild(link);
            } else {
              title.textContent = event.title;
            }
            block.appendChild(title);

            if (event.description) {
              block.appendChild(make("span", "event-description", event.description));
            }
            block.appendChild(make("span", "event-time", formatRange(event)));
            if (event.location) {
              block.appendChild(make("span", "event-location", event.location));
            }
            track.appendChild(block);
          }

          grid.appendChild(track);
        }
      };

      const renderLegend = () => {
        const legend = document.getElementById("legend");
        const usedTypes = [...new Set(data.meetings.map((event) => event.type || "other"))];

        for (const typeName of usedTypes) {
          const type = TYPES[typeName] || TYPES.other;
          const item = make("li");
          const swatch = make("span", `swatch ${type.className}`);
          item.appendChild(swatch);
          item.appendChild(document.createTextNode(type.label));
          legend.appendChild(item);
        }
      };

      const renderAgenda = () => {
        const agenda = document.getElementById("agenda");

        for (const day of DAYS) {
          const card = make("section", "day-card");
          const heading = make("h3", "", day.name);
          heading.id = `day-${day.code}`;
          card.setAttribute("aria-labelledby", heading.id);
          card.appendChild(heading);

          const events = data.meetings
            .filter((event) => event.days.includes(day.code))
            .sort((a, b) => minuteValue(a.start) - minuteValue(b.start));

          if (!events.length) {
            card.appendChild(make("p", "empty-day", "No regularly scheduled meetings."));
            agenda.appendChild(card);
            continue;
          }

          const list = make("ol");
          for (const event of events) {
            const type = eventType(event);
            const item = make("li", "agenda-item");

            item.appendChild(make("span", "category-label", type.label));

            const range = make("time", "", formatRange(event));
            range.setAttribute("datetime", `${event.start}/${event.end}`);
            item.appendChild(range);

            const title = make("strong");
            if (event.url) {
              const link = make("a", "", event.title);
              link.href = event.url;
              title.appendChild(link);
            } else {
              title.textContent = event.title;
            }
            item.appendChild(title);

            if (event.description) {
              item.appendChild(make("span", "", event.description));
            }
            if (event.location) {
              item.appendChild(make("span", "", `Location: ${event.location}`));
            }

            list.appendChild(item);
          }

          card.appendChild(list);
          agenda.appendChild(card);
        }
      };

      const renderFooter = () => {
        document.getElementById("schedule-note").textContent = data.note || "";
        document.getElementById("appointment-note").textContent =
          data.appointmentNote || "";

        const contact = document.getElementById("contact-list");

        if (data.contact?.email) {
          const item = make("li");
          item.appendChild(document.createTextNode("Email: "));
          const link = make("a", "", data.contact.email);
          link.href = `mailto:${data.contact.email}`;
          item.appendChild(link);
          contact.appendChild(item);
        }

        if (data.contact?.phone) {
          const item = make("li");
          item.appendChild(document.createTextNode("Phone: "));
          const link = make("a", "", data.contact.phone);
          link.href = `tel:${data.contact.phone.replace(/[^\d+]/g, "")}`;
          item.appendChild(link);
          contact.appendChild(item);
        }

        if (data.contact?.webexUrl) {
          const item = make("li");
          const link = make(
            "a",
            "",
            data.contact.webexLabel || "Web conference link"
          );
          link.href = data.contact.webexUrl;
          item.appendChild(link);
          contact.appendChild(item);
        }
      };

      const zonedParts = (date) => {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone: data.timeZone,
          weekday: "short",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        }).formatToParts(date);

        return Object.fromEntries(
          parts
            .filter((part) => part.type !== "literal")
            .map((part) => [part.type, part.value])
        );
      };

      const dateStringFromParts = (parts) =>
        `${parts.year}-${parts.month}-${parts.day}`;

      const currentDayCode = (weekday) =>
        ({ Mon: "M", Tue: "T", Wed: "W", Thu: "R", Fri: "F" })[weekday] || "";

      const withinSemester = (dateString) => {
        if (data.startDate && dateString < data.startDate) return false;
        if (data.endDate && dateString > data.endDate) return false;
        return true;
      };

      const nextScheduledEvent = (now) => {
        for (let offset = 0; offset < 8; offset += 1) {
          const candidate = new Date(now.getTime() + offset * 24 * 60 * 60 * 1000);
          const parts = zonedParts(candidate);
          const dateString = dateStringFromParts(parts);
          if (!withinSemester(dateString)) continue;

          const dayCode = currentDayCode(parts.weekday);
          if (!dayCode) continue;

          const candidateMinutes =
            offset === 0 ? Number(parts.hour) * 60 + Number(parts.minute) : -1;

          const event = data.meetings
            .filter((item) => item.days.includes(dayCode))
            .filter((item) => minuteValue(item.start) > candidateMinutes)
            .sort((a, b) => minuteValue(a.start) - minuteValue(b.start))[0];

          if (event) {
            const dayName = DAYS.find((day) => day.code === dayCode)?.name;
            return { event, dayName, offset };
          }
        }
        return null;
      };

      const renderCurrentStatus = () => {
        const now = new Date();
        const parts = zonedParts(now);
        const dateString = dateStringFromParts(parts);
        const dayCode = currentDayCode(parts.weekday);
        const nowMinutes = Number(parts.hour) * 60 + Number(parts.minute);
        const currentSummary = document.getElementById("current-summary");
        const stamp = document.getElementById("current-stamp");

        stamp.textContent = `Updated ${new Intl.DateTimeFormat("en-US", {
          timeZone: data.timeZone,
          weekday: "long",
          hour: "numeric",
          minute: "2-digit"
        }).format(now)} ${data.timeZoneLabel || ""}.`;

        document.querySelectorAll(".event.current").forEach((element) => {
          element.classList.remove("current");
        });

        if (!withinSemester(dateString)) {
          currentSummary.textContent =
            "This recurring schedule is not currently in its active date range.";
          return;
        }

        const current = data.meetings.find(
          (event) =>
            event.days.includes(dayCode) &&
            minuteValue(event.start) <= nowMinutes &&
            nowMinutes < minuteValue(event.end)
        );

        if (current) {
          const location = current.location ? ` at ${current.location}` : "";
          currentSummary.textContent =
            `Now: ${current.title}${location}, until ${formatTime(current.end)}.`;

          document
            .querySelectorAll(
              `.event[data-day="${dayCode}"][data-start="${current.start}"][data-end="${current.end}"]`
            )
            .forEach((element) => element.classList.add("current"));
          return;
        }

        const next = nextScheduledEvent(now);
        if (next) {
          const when =
            next.offset === 0
              ? `today at ${formatTime(next.event.start)}`
              : `${next.dayName} at ${formatTime(next.event.start)}`;
          const location = next.event.location
            ? `, ${next.event.location}`
            : "";
          currentSummary.textContent =
            `No scheduled block right now. Next: ${next.event.title}, ${when}${location}.`;
        } else {
          currentSummary.textContent =
            "No scheduled block right now, and no later recurring block was found.";
        }
      };

      const showError = (error) => {
        console.error(error);
        const summary = document.getElementById("current-summary");
        summary.textContent =
          "The schedule could not be displayed. Please contact the instructor.";
        const details = document.getElementById("weekly-details");
        const message = make(
          "p",
          "noscript",
          `Schedule configuration error: ${error.message}`
        );
        details.appendChild(message);
      };

      try {
        validate();
        renderHeader();
        renderVisualGrid();
        renderLegend();
        renderAgenda();
        renderFooter();
        renderCurrentStatus();
        window.setInterval(renderCurrentStatus, 60_000);
      } catch (error) {
        showError(error);
      }
    })();
  </script>
</body>
</html>
