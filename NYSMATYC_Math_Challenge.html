<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYSMATYC Math Challenge Exam</title>
<style>
  :root { color-scheme: light; --teal: #126258; --ink: #112d32; --accent: #b45325; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: #edf1f0; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
  .poster { max-width: 816px; margin: auto; background: white; box-shadow: 0 8px 40px #112d3214; }
  .masthead { min-height: 180px; padding: 23px 60px 6px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .organization { color: var(--teal); font-size: 32px; font-weight: 700; }
  .logo { display: block; width: 216px; height: auto; }
  h1 { margin: 0; padding: 23px 60px; background: var(--teal); color: white; font-size: 62px; line-height: 1.18; font-weight: 700; }
  .content { padding: 30px 60px 38px; }
  .date { margin: 0 0 12px; color: var(--accent); font-size: 46px; line-height: 1.25; font-weight: 700; }
  .event { margin: 0; font-size: 35px; line-height: 1.55; font-weight: 700; }
  .details { margin-top: 26px; font-size: 28px; line-height: 1.25; }
  .details p { margin: 0 0 20px; }
  .prize { margin: 25px 0 24px; color: var(--accent); font-size: 30px; line-height: 1.2; font-weight: 700; }
  .refreshments { margin: 0; color: var(--teal); font-size: 29px; line-height: 1.4; font-weight: 700; }
  .links { margin-top: 38px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; font-size: 25px; line-height: 1.3; font-weight: 700; }
  a { color: var(--teal); text-decoration-thickness: 1px; text-underline-offset: 4px; }
  a:hover { color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
  @media (max-width: 650px) {
    body { padding: 0; }
    .poster { box-shadow: none; }
    .masthead { min-height: 135px; padding: 18px 7%; gap: 12px; }
    .organization { font-size: clamp(20px, 4vw, 28px); }
    .logo { width: 34%; max-width: 180px; }
    h1 { padding: 24px 7%; font-size: clamp(32px, 7.6vw, 54px); }
    .content { padding: 26px 7% 34px; }
    .date { font-size: clamp(30px, 6vw, 42px); }
    .event { font-size: clamp(24px, 4.5vw, 32px); }
    .details { font-size: clamp(20px, 3.7vw, 26px); }
    .prize { font-size: clamp(22px, 4vw, 28px); }
    .refreshments { font-size: clamp(21px, 3.8vw, 27px); }
    .links { font-size: clamp(20px, 3.5vw, 24px); }
  }
  @page { size: letter portrait; margin: 0; }
  @media print {
    html, body { width: 8.5in; margin: 0; padding: 0; background: white; }
    body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .poster { width: 816px; max-width: none; box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
